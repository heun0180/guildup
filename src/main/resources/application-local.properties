# Vite 개발 서버에서만 사용한다. 운영에는 local 프로필을 활성화하지 않는다.
# HTTP 예외는 명시적 local 프로필 + localhost/loopback 주소에만 허용한다.
auth.email-verification.url=${EMAIL_VERIFICATION_URL:http://localhost:5173/email-verification.html}
auth.email-verification.allow-local-http=true

# 로컬 화면의 수동 재설정 테스트에 기존 SMTP를 사용한다. 발송 차단은 환경변수 false로 설정한다.
auth.password-reset.mail-enabled=${PASSWORD_RESET_MAIL_ENABLED:true}
auth.password-reset.url=${PASSWORD_RESET_URL:http://localhost:5173/password-reset.html}
auth.password-reset.allow-local-http=true
