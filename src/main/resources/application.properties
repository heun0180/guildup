# Spring Boot 애플리케이션 식별 이름
spring.application.name=guildup-backend

# 로컬 PostgreSQL 연결 설정
spring.datasource.url=jdbc:postgresql://localhost:5432/guildup
spring.datasource.username=kwonseonghyeon
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# 개발 중 엔티티 변경을 DB 스키마에 반영한다. SQL 본문은 개인정보 노출과 운영 로그 과다를 막기 위해 출력하지 않는다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# 공통 SMTP 설정. 업체별 연결/인증 정보는 기존 MAIL_* 환경변수로 주입한다.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}
spring.mail.properties.mail.debug=false

# 모든 발송 경로가 공유하는 공식 From. SMTP 인증 사용자명과 분리한다.
app.mail.from=${MAIL_FROM:noreply@guild-up.com}
app.mail.from-name=${MAIL_FROM_NAME:GuildUp}
# 수신 가능한 회신 주소가 필요할 때만 운영자가 지정한다. noreply는 수신함이 아니다.
app.mail.reply-to=${MAIL_REPLY_TO:}
# 문의/건의 알림은 기존 개인 Gmail로 계속 받는다. 수신처와 발신 계정은 별개다.
app.mail.feedback-to=${FEEDBACK_MAIL_TO:heun0180@gmail.com}

# Discord 사용자 OAuth 설정. 실제 비밀값은 환경변수에서 주입한다.
discord.oauth.client-id=${DISCORD_CLIENT_ID:}
discord.oauth.client-secret=${DISCORD_CLIENT_SECRET:}
discord.oauth.redirect-uri=${DISCORD_REDIRECT_URI:}

# Discord 공지 DM의 동일 요청 재전송 방지 시간
discord.dm.duplicate-window=${DISCORD_DM_DUPLICATE_WINDOW:10s}

# 시작 시 Discord 클랜원 전체 확인은 이 개수만 병렬 실행한다.
discord.member-reconciliation.concurrency=${DISCORD_MEMBER_RECONCILIATION_CONCURRENCY:5}
discord.member-reconciliation.queue-capacity=${DISCORD_MEMBER_RECONCILIATION_QUEUE_CAPACITY:10000}
discord.member-events.concurrency=${DISCORD_MEMBER_EVENT_CONCURRENCY:8}
discord.member-events.queue-capacity=${DISCORD_MEMBER_EVENT_QUEUE_CAPACITY:10000}

# PUBG API는 서버에서만 호출하며 키를 브라우저에 전달하지 않는다.
pubg.api-key=${PUBG_API_KEY:}
pubg.match.fetch-concurrency=${PUBG_MATCH_FETCH_CONCURRENCY:3}
pubg.telemetry.fetch-concurrency=${PUBG_TELEMETRY_FETCH_CONCURRENCY:3}
pubg.base-url=https://api.pubg.com
# 단일 서버의 PUBG API 호출 시작 간 최소 간격. 응답의 rate-limit reset 정보가 있으면 더 느리게 조정된다.
pubg.request-min-interval=${PUBG_REQUEST_MIN_INTERVAL:250ms}

# TrustedProxyFilter만 socket peer를 검증한 뒤 forwarded headers를 적용한다.
# framework/native로 바꾸면 시작을 거부한다. 신뢰 목록이 비어 있으면 모든 프록시 헤더를 무시한다.
server.forward-headers-strategy=none
security.proxy.trusted-proxies=${AUTH_TRUSTED_PROXIES:}
security.proxy.client-ip-header=${AUTH_CLIENT_IP_HEADER:X_FORWARDED_FOR}

# 이메일 로그인 방어 (단일 서버, 메모리 저장). 차단 요청은 계정 대기 시간을 연장하지 않는다.
security.login.account-free-failures=${LOGIN_ACCOUNT_FREE_FAILURES:4}
security.login.account-base-delay=${LOGIN_ACCOUNT_BASE_DELAY:2s}
security.login.account-max-delay=${LOGIN_ACCOUNT_MAX_DELAY:30s}
security.login.account-failure-ttl=${LOGIN_ACCOUNT_FAILURE_TTL:15m}
security.login.ip-short-limit=${LOGIN_IP_SHORT_LIMIT:120}
security.login.ip-short-window=${LOGIN_IP_SHORT_WINDOW:1m}
security.login.ip-long-limit=${LOGIN_IP_LONG_LIMIT:600}
security.login.ip-long-window=${LOGIN_IP_LONG_WINDOW:15m}
security.login.spray-accounts=${LOGIN_SPRAY_ACCOUNTS:20}
security.login.spray-failures=${LOGIN_SPRAY_FAILURES:20}
security.login.spray-failure-percent=${LOGIN_SPRAY_FAILURE_PERCENT:80}
security.login.spray-window=${LOGIN_SPRAY_WINDOW:5m}
security.login.spray-delay=${LOGIN_SPRAY_DELAY:30s}
security.login.max-accounts=${LOGIN_MAX_ACCOUNTS:20000}
security.login.max-ips=${LOGIN_MAX_IPS:10000}
security.login.max-concurrent-verifications=${LOGIN_MAX_CONCURRENT_VERIFICATIONS:8}
security.login.ipv6-prefix-length=${LOGIN_IPV6_PREFIX_LENGTH:64}
security.login.cleanup-interval=${LOGIN_CLEANUP_INTERVAL:1m}
security.login.event-interval=${LOGIN_EVENT_INTERVAL:1m}
security.login.max-events-per-minute=${LOGIN_MAX_EVENTS_PER_MINUTE:60}
security.diagnostics.max-events-per-minute=${ACCESS_DENIED_MAX_EVENTS_PER_MINUTE:30}
# 비어 있으면 재시작마다 임의의 32바이트 키를 생성한다. 운영에서는 별도 32바이트 이상 비밀키 권장.
security.login.hmac-secret=${LOGIN_HMAC_SECRET:}

# Local HTTP stays usable. HTTPS deployments use the prod profile or SESSION_COOKIE_SECURE=true.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.tracking-modes=cookie

# Actuator는 내부 metric 수집에만 사용하며 HTTP endpoint로 직접 노출하지 않는다.
management.endpoints.web.exposure.exclude=*
management.endpoint.health.show-details=never

# 운영 모니터링 이벤트 보관 기간과 느린 빙고 집계 기준
monitoring.retention-days=${MONITORING_RETENTION_DAYS:30}
monitoring.bingo.slow-threshold=${MONITORING_BINGO_SLOW_THRESHOLD:2m}

# 최근 INFO 이상 로그만 제한된 메모리에 보관한다. SSE는 시스템 개발자 전용이다.
monitoring.logs.capacity=${MONITORING_LOG_CAPACITY:1000}
# 업무 트랜잭션/응답이 장애 이력 DB 저장을 기다리지 않도록 제한된 독립 큐를 사용한다.
monitoring.events.async=${MONITORING_EVENTS_ASYNC:true}

# 이메일 인증: 문의 메일과 공통 SMTP/From을 공유하며 발송 책임은 분리한다.
auth.email-verification.mail-enabled=${EMAIL_VERIFICATION_MAIL_ENABLED:true}
# 실제 프론트엔드 HTTPS 주소를 지정해야 한다. 예약 .example 기본 주소로는 메일을 보내지 않는다.
auth.email-verification.url=${EMAIL_VERIFICATION_URL:https://guildup.example/email-verification.html}
# 개발용 local 프로필만 localhost HTTP 링크 예외를 명시적으로 설정한다.
auth.email-verification.allow-local-http=false
auth.email-verification.token-ttl=${EMAIL_VERIFICATION_TOKEN_TTL:300s}
auth.email-verification.resend-interval=${EMAIL_VERIFICATION_RESEND_INTERVAL:60s}
auth.email-verification.account-hourly-limit=${EMAIL_VERIFICATION_ACCOUNT_HOURLY_LIMIT:3}
auth.email-verification.account-daily-limit=${EMAIL_VERIFICATION_ACCOUNT_DAILY_LIMIT:5}
auth.email-verification.ip-hourly-limit=${EMAIL_VERIFICATION_IP_HOURLY_LIMIT:20}
auth.email-verification.ip-daily-limit=${EMAIL_VERIFICATION_IP_DAILY_LIMIT:50}
auth.email-verification.confirm-per-minute=${EMAIL_VERIFICATION_CONFIRM_PER_MINUTE:20}
auth.email-verification.max-ip-entries=${EMAIL_VERIFICATION_MAX_IP_ENTRIES:10000}
auth.email-verification.max-events-per-minute=${EMAIL_VERIFICATION_MAX_EVENTS_PER_MINUTE:30}
auth.email-verification.retention=${EMAIL_VERIFICATION_RETENTION:7d}
auth.email-verification.delivery-timeout=${EMAIL_VERIFICATION_DELIVERY_TIMEOUT:10m}
auth.email-verification.cleanup-cron=${EMAIL_VERIFICATION_CLEANUP_CRON:0 40 4 * * *}
# 검증 후 단계적으로 활성화. 기존 계정 및 Discord 연결 계정은 제외한다.
auth.email-verification.enforce-new-users=${EMAIL_VERIFICATION_ENFORCE_NEW_USERS:false}

# Reset mail is opt-in; existing Resend SMTP/MAIL_* settings are reused unchanged.
auth.password-reset.mail-enabled=${PASSWORD_RESET_MAIL_ENABLED:false}
auth.password-reset.url=${PASSWORD_RESET_URL:https://guild-up.com/password-reset.html}
auth.password-reset.allow-local-http=false
auth.password-reset.token-ttl=${PASSWORD_RESET_TOKEN_TTL:30m}
auth.password-reset.request-interval=${PASSWORD_RESET_REQUEST_INTERVAL:60s}
auth.password-reset.account-hourly-limit=${PASSWORD_RESET_ACCOUNT_HOURLY_LIMIT:3}
auth.password-reset.account-daily-limit=${PASSWORD_RESET_ACCOUNT_DAILY_LIMIT:5}
auth.password-reset.ip-hourly-limit=${PASSWORD_RESET_IP_HOURLY_LIMIT:20}
auth.password-reset.ip-daily-limit=${PASSWORD_RESET_IP_DAILY_LIMIT:50}
auth.password-reset.token-requests-per-minute=${PASSWORD_RESET_TOKEN_REQUESTS_PER_MINUTE:20}
auth.password-reset.max-ip-entries=${PASSWORD_RESET_MAX_IP_ENTRIES:10000}
auth.password-reset.max-events-per-minute=${PASSWORD_RESET_MAX_EVENTS_PER_MINUTE:30}
auth.password-reset.mail-daily-budget=${PASSWORD_RESET_MAIL_DAILY_BUDGET:30}
auth.password-reset.mail-monthly-budget=${PASSWORD_RESET_MAIL_MONTHLY_BUDGET:600}
auth.password-reset.retention=${PASSWORD_RESET_RETENTION:7d}
auth.password-reset.cleanup-cron=${PASSWORD_RESET_CLEANUP_CRON:0 20 * * * *}
