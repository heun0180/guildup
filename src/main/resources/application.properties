# Spring Boot 애플리케이션 식별 이름
spring.application.name=guildup-backend

# 로컬 PostgreSQL 연결 설정
spring.datasource.url=jdbc:postgresql://localhost:5432/guildup
spring.datasource.username=kwonseonghyeon
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# 개발 중 엔티티 변경을 DB 스키마에 반영하고 실행 SQL을 보기 좋게 출력한다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Discord 사용자 OAuth 설정. 실제 비밀값은 환경변수에서 주입한다.
discord.oauth.client-id=${DISCORD_CLIENT_ID:}
discord.oauth.client-secret=${DISCORD_CLIENT_SECRET:}
discord.oauth.redirect-uri=${DISCORD_REDIRECT_URI:}

# Discord 공지 DM의 동일 요청 재전송 방지 시간
discord.dm.duplicate-window=${DISCORD_DM_DUPLICATE_WINDOW:10s}

# 시작 시 Discord 클랜원 전체 확인은 이 개수만 병렬 실행한다.
discord.member-reconciliation.concurrency=${DISCORD_MEMBER_RECONCILIATION_CONCURRENCY:5}
discord.member-reconciliation.queue-capacity=${DISCORD_MEMBER_RECONCILIATION_QUEUE_CAPACITY:10000}
discord.member-events.concurrency=${DISCORD_MEMBER_EVENT_CONCURRENCY:8}
discord.member-events.queue-capacity=${DISCORD_MEMBER_EVENT_QUEUE_CAPACITY:10000}

# PUBG API는 서버에서만 호출하며 키를 브라우저에 전달하지 않는다.
pubg.api-key=${PUBG_API_KEY:}
pubg.base-url=https://api.pubg.com
